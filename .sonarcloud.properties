# Read by SonarCloud automatic analysis (sonar-project.properties is only read by the CLI).
# Keep sources, exclusions and tests in sync with sonar-project.properties.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/.devcontainer/**,.claude/**,.playwright-mcp/**,.sonarlint/**,.vscode/**
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
